services:
  checks:
    image: java-renew-checks:local
    build: .
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - maven-cache:/home/vscode/.m2
      - gradle-cache:/home/vscode/.gradle
      - check-reports:/reports
    mem_limit: 4g
    cpus: 2

  offline:
    extends:
      service: checks
    profiles: [offline]
    network_mode: none
    command: [python3, scripts/checks.py, --offline, --output, /reports/offline]

  security:
    extends:
      service: checks
    profiles: [security]
    command: [python3, scripts/checks.py, --suite, security,
              --scan-root, /workspace/testdata/scenarios, --output, /reports/security]

volumes:
  maven-cache:
  gradle-cache:
  check-reports:
